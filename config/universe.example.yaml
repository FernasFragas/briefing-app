  # --- Added 2026-08-31 ----------------------------------------------------------
  #
  # Source coverage was probed per symbol before these were added, because FMP's free
  # plan gates by symbol as well as by endpoint. Results (2026-08-31):
  #
  #   ticker   FMP quote/prices          CBOE delayed chain
  #   INTC     200 (NASDAQ, $89.47)      200, 2,376 contracts
  #   CRWV     402 symbol gate           200, 1,922 contracts
  #   AMAT     402 symbol gate           200, 3,236 contracts
  #   RHM.DE   402 symbol gate           403 AccessDenied (US venue only)
  #   LDO.MI   402 symbol gate           403 AccessDenied (US venue only)
  #
  # Only INTC has a complete data path today. The consequences are structural, not
  # cosmetic, so they are recorded here rather than discovered per run:
  #
  #   CRWV, AMAT  - options chain resolves, but no price history means no realized vol
  #                 and no measured sigma range. "Missing measured sigma" is a universal
  #                 Tier C floor (T7), so both stay watchlist-only until the FMP symbol
  #                 gate is resolved (PA4/PB4/I13 - the A2 decision now covers 4 names,
  #                 not 2). Alpha Vantage `daily` is the documented fallback and is
  #                 currently refusing every function, so it is not a fallback today.
  #   RHM.DE,     - no options chain at all, so S_O is n/a. Both V and E require S_O
  #   LDO.MI        (REQUIRED_COMPONENTS, models/scoring.py:33), which is the demotion
  #                 `eu_options_track: C` already describes. Class P would avoid S_O but
  #                 is not in `enabled_expression_classes`, and P requires S_I and S_F,
  #                 which have no live source either. Tier C until a Eurex per-strike
  #                 capture exists (schemas/eurex_options_manual_capture.csv).
  #
  # CATALYST DATES BELOW ARE UNSOURCED PLACEHOLDERS. Every `estimated` entry here is a
  # cadence guess, not a calendar reading. Re-source each one from issuer IR before any
  # live run, exactly as the file header requires. The gate checks that a dated catalyst
  # exists in the horizon, never that the date is right.

  - ticker: INTC
    name: Intel Corporation
    venue: NASDAQ
    sector: Semiconductors
    direction: long
