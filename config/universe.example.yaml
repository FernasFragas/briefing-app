# Fixed briefing universe - the 8-12 liquid names followed every run.
#
# ILLUSTRATIVE ONLY. Catalyst dates here are placeholders: re-source every date from
# issuer IR or an exchange/regulator calendar before a real run. The gate checks that a
# dated catalyst exists in the horizon, not that the date is correct.

source: fixed_universe

defaults:
  geography: US
  currency: USD
  broker: IBKR
  permitted_instruments: [shares, options]

