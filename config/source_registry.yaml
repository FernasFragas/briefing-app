version: 2

# `required: false` marks an endpoint the current plan is not expected to cover. It is
# still probed and still reports its true status; it just does not fail preflight, so a
# known entitlement ceiling cannot mask a real regression on an entitled source.

sources:
  - id: cboe_delayed_options
    display_name: CBOE public delayed options chain
    priority: primary
    geography: [US]
    source_type: http_json
    components: [S_O]
    entitlement: free_delayed
    staleness_bound: same_session
    endpoints:
      - id: delayed_options_chain
        component: S_O
        method: GET
        url_template: https://cdn.cboe.com/api/global/delayed_quotes/options/{ticker}.json
        cache_provider: cboe
        cache_endpoint: delayed_options_chain
        probe_enabled: true
        required_json_paths:
          - data.options
        note: Primary US options source. Delayed feed; print timestamp.

  - id: alpha_vantage
    display_name: Alpha Vantage
    priority: primary_or_fallback
    geography: [US, EU]
    source_type: http_json
    components: [S_O, S_M, S_S, S_I, S_F]
    entitlement: key_required_plan_gated
    staleness_bound: endpoint_specific
    credential_env: ALPHA_VANTAGE_API_KEY
    # A free key allows 25 requests per day in total and asks for at most one per
    # second, and answers HTTP 200 with a rate-limit notice once either is crossed - a
    # body indistinguishable from a data failure by the time it reaches a component.
    # Only `symbol_search` is probed on every run; the rest are `probe_tier: deep`, so a
    # routine preflight spends one request rather than twelve of the day's twenty-five.
    probe_delay_seconds: 1.2
    endpoints:
      - id: symbol_search
        component: reference
        method: GET
        url_template: https://www.alphavantage.co/query?function=SYMBOL_SEARCH&keywords={ticker}&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: symbol_search
        probe_enabled: true
        required_json_paths:
          - bestMatches
        note: Cheap entitlement probe and ticker venue lookup.
      - id: realtime_options
        component: S_O
        method: GET
        url_template: https://www.alphavantage.co/query?function=REALTIME_OPTIONS&symbol={ticker}&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: realtime_options
        probe_enabled: true
        probe_tier: deep
        required: false
        required_json_paths:
          - data
        note: >-
          Premium options entitlement, not held on the current plan: the endpoint answers
          HTTP 200 with an artificial sample schema, which validation reports as synthetic.
          CBOE is the US options source.
      - id: global_quote
        component: quote
        method: GET
        url_template: https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol={ticker}&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: global_quote
        probe_enabled: true
        probe_tier: deep
        required_json_paths:
          - Global Quote
        note: Quote source for spot and daily snapshot spot.
      - id: daily
        component: price_history
        method: GET
        url_template: https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol={ticker}&outputsize=compact&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: daily
        probe_enabled: true
        probe_tier: deep
        required_json_paths:
          - Time Series (Daily)
        note: >-
          Unadjusted daily bars. Free on every plan and the price-history fallback when
          the adjusted series is not entitled; adequate for short-horizon realized vol.
      - id: daily_adjusted
        component: price_history
        method: GET
        url_template: https://www.alphavantage.co/query?function=TIME_SERIES_DAILY_ADJUSTED&symbol={ticker}&outputsize=compact&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: daily_adjusted
        probe_enabled: true
        probe_tier: deep
        required: false
        required_json_paths:
          - Time Series (Daily)
        note: >-
          Split/dividend-adjusted bars. Separately gated premium endpoint; preferred when
          entitled because unadjusted closes distort sigma across a split.
      - id: news_sentiment
        component: S_S
        method: GET
        url_template: https://www.alphavantage.co/query?function=NEWS_SENTIMENT&tickers={ticker}&limit=1000&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: news_sentiment
        probe_enabled: true
        probe_tier: deep
        required_json_paths:
          - feed
        note: >-
          Quota-sensitive; daily pipeline fetches after candidate gate. Limit is set to
          1000 explicitly so an entitlement probe measures the feed rather than Alpha
          Vantage's default 50-row page.
      - id: earnings_calendar
        component: catalyst
        method: GET
        url_template: https://www.alphavantage.co/query?function=EARNINGS_CALENDAR&symbol={ticker}&horizon=3month&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: earnings_calendar
        probe_enabled: true
        probe_tier: deep
        response_format: text
        probe_symbol: AAPL
        note: CSV endpoint; absence from provider output is not proof of no event.
      - id: insider_transactions
        component: S_I
        method: GET
        url_template: https://www.alphavantage.co/query?function=INSIDER_TRANSACTIONS&symbol={ticker}&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: insider_transactions
        probe_enabled: true
        probe_tier: deep
        probe_symbol: AAPL
        required_json_paths:
          - data
        note: >-
          Probed against an operating company: an index ETF has no Form 4 filers, so an
          empty response there would say nothing about the entitlement.
      - id: institutional_holdings
        component: S_F
        method: GET
        url_template: https://www.alphavantage.co/query?function=INSTITUTIONAL_HOLDINGS&symbol={ticker}&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: institutional_holdings
        probe_enabled: true
        probe_tier: deep
        probe_symbol: AAPL
        required_json_paths:
          - holdings
        note: Holder-level rows live under `holdings`, with the aggregates at the root.
      - id: realtime_put_call_ratio
        component: S_O
        method: GET
        url_template: https://www.alphavantage.co/query?function=REALTIME_PUT_CALL_RATIO&symbol={ticker}&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: realtime_put_call_ratio
        probe_enabled: true
        probe_tier: deep
        required: false
        required_json_paths:
          - put_call_ratio_full_chain
        note: >-
          Optional only. The live S_O put/call level and baselines are computed from the
          CBOE chain and persisted snapshots, so this AV endpoint must not consume the
          required-provider slot.
      - id: historical_options
        component: S_O
        method: GET
        url_template: https://www.alphavantage.co/query?function=HISTORICAL_OPTIONS&symbol={ticker}&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: historical_options
        probe_enabled: true
        probe_tier: deep
        required: false
        required_json_paths:
          - data
        note: >-
          Premium options entitlement, not held on the current plan. Backfill for IV rank
          history; same sample-data traps as realtime options.
      - id: macro
        component: S_M
        method: GET
        url_template: https://www.alphavantage.co/query?function=CPI&apikey={api_key}
        cache_provider: alpha_vantage
        cache_endpoint: macro
        probe_enabled: true
        probe_tier: deep
        cache_target_template: cpi
        required_json_paths:
          - data
        note: One cache slot for every macro series; the function name is the cache target.

  - id: finnhub
    display_name: Finnhub
    priority: primary_or_fallback
    geography: [US]
    source_type: http_json
    components: [S_S]
    entitlement: key_required
    staleness_bound: daily
    credential_env: FINNHUB_API_KEY
    # Free tier is a rate limit rather than a daily allowance: 60 requests/minute, with a
    # separate 30/second ceiling in the terms and no published daily cap. That is the
    # point of the source - Alpha Vantage's 25/day could not serve a multi-ticker run.
    # Free tier is also US-only: RHM.DE answered HTTP 403 on 2026-08-31 while US symbols
    # returned 200, so the client refuses an exchange-suffixed symbol before requesting.
    endpoints:
      - id: company_news
        component: S_S
        method: GET
        url_template: https://finnhub.io/api/v1/company-news?symbol={ticker}&from={from_date}&to={to_date}&token={api_key}
        cache_provider: finnhub
        cache_endpoint: company_news
        cache_target_template: "{ticker}"
        probe_enabled: true
        probe_symbol: AAPL
        probe_window_days: 7
        required_json_paths:
          - root
        note: >-
          Company news over a dated window. Verified 2026-08-31: HTTP 200, 95 rows. The
          articles carry no sentiment field - /news-sentiment is 403 on this tier - so
          tone is derived locally by providers/news_tone.py and the batch names it
          "local tone" so no reader takes it for a vendor's scored feed.
      - id: recommendation_trends
        component: S_S
        method: GET
        url_template: https://finnhub.io/api/v1/stock/recommendation?symbol={ticker}&token={api_key}
        cache_provider: finnhub
        cache_endpoint: recommendation_trends
        cache_target_template: "{ticker}"
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: >-
          Analyst counts per bucket, one row per month. Verified 2026-08-31: HTTP 200,
          4 rows. Second feed for the analyst leg, which otherwise carries the whole of
          S_S on FMP alone. Maps to buy/hold/sell counts, not a vendor score, so the two
          feeds are comparable. Finnhub's own price target is 403 on this tier, so target
          consensus stays sole-sourced on FMP.

  - id: fred
    display_name: FRED (Federal Reserve Bank of St. Louis)
    priority: primary
    geography: [US]
    source_type: http_json
    components: [S_M]
    entitlement: key_required
    staleness_bound: release_cadence
    credential_env: FRED_API_KEY
    # Official primary publisher rather than an aggregator, which is what upgrades S_M's
    # source-quality label. All series below verified entitled on a free key 2026-08-31.
    # A keyless path serving the same series exists (fredgraph.csv) and is documented in
    # docs/research/alternatives/pa9-macro-keyless-alternative.md; only the keyed API carries the
    # release calendar.
    endpoints:
      - id: series_observations
        component: S_M
        method: GET
        url_template: https://api.stlouisfed.org/fred/series/observations?series_id=CPIAUCSL&sort_order=asc&api_key={api_key}&file_type=json
        cache_provider: fred
        cache_endpoint: series_observations
        cache_target_template: CPIAUCSL
        probe_enabled: true
        required_json_paths:
          - observations
        note: >-
          One macro series, oldest-first. FRED writes a missing observation as the literal
          string "." - a real row on days a daily series does not publish, such as a market
          holiday on DGS10 - so those are skipped rather than read as zero.
      - id: release_dates
        component: S_M
        method: GET
        url_template: https://api.stlouisfed.org/fred/release/dates?release_id=10&sort_order=asc&api_key={api_key}&file_type=json
        cache_provider: fred
        cache_endpoint: release_dates
        cache_target_template: "10"
        probe_enabled: true
        required_json_paths:
          - release_dates
        note: >-
          Scheduled publication dates for one release - the macro calendar FMP leaves
          paywalled, and since 2026-09-02 the source of `macro_calendar`. Asked twice per
          release: backwards to date a reading by its publication, forwards for what is
          scheduled next, cached as `<release_id>` and `<release_id>_upcoming`. The
          realtime period does bound the dates returned - release 18 answered 2,493 dates
          for a ten-year window and 22 for the next thirty days, 21 of them still in the
          future. The forward call requires `realtime_start` rather than a populated
          `release_dates`: a monthly release with no date this month answers `count: 0`
          with an empty list, and that is the calendar's answer, not a failed call. The
          historical call keeps the strict requirement, because zero dates over ten years
          is not plausible. Preflight probes known release 10 directly; live pipeline
          resolves release ids through `series_release` before asking this endpoint.
      - id: series_release
        component: S_M
        method: GET
        url_template: https://api.stlouisfed.org/fred/series/release?series_id=CPIAUCSL&api_key={api_key}&file_type=json
        cache_provider: fred
        cache_endpoint: series_release
        cache_target_template: CPIAUCSL
        probe_enabled: true
        required_json_paths:
          - releases
        note: >-
          Maps a series to the release that publishes it, so calendar entries can be joined
          to the factor they move. Verified 2026-08-31: CPIAUCSL -> release_id 10.

  - id: twelve_data
    display_name: Twelve Data
    priority: fallback
    geography: [US]
    source_type: http_json
    components: [price_history]
    entitlement: key_required_metered
    staleness_bound: daily
    credential_env: TWELVE_DATA_API_KEY
    # Basic plan: 8 API credits/minute and 800/day. The time_series endpoint costs
    # 1 credit per symbol and is wired only behind FMP for names FMP gates by symbol.
    endpoints:
      - id: time_series
        component: price_history
        method: GET
        url_template: https://api.twelvedata.com/time_series?symbol={ticker}&interval=1day&start_date={from_date}&end_date={to_date}&apikey={api_key}
        cache_provider: twelve_data
        cache_endpoint: time_series
        cache_target_template: "{ticker}"
        probe_enabled: true
        probe_symbol: AVGO
        probe_window_days: 400
        required_json_paths:
          - values
        note: >-
          Daily OHLCV fallback for FMP's free-plan symbol gates. Verified before wiring
          for AVGO, ORCL, MU, QQQ, CRWV and AMAT; RHM.DE and LDO.MI remain paid-plan
          gated on Twelve Data and stay out of this US fallback.

  - id: fmp
    display_name: Financial Modeling Prep
    priority: primary_or_fallback
    geography: [US, EU]
    source_type: http_json
    components: [S_M, S_S, S_I, S_F]
    entitlement: key_required_plan_gated
    staleness_bound: endpoint_specific
    credential_env: FMP_API_KEY
    # The v3/v4 API was retired for new subscriptions on 2025-08-31 and answers HTTP 403
    # `Legacy Endpoint` regardless of key. Every path below is on the `stable` API.
    endpoints:
      - id: quote
        component: reference
        method: GET
        url_template: https://financialmodelingprep.com/stable/quote?symbol={ticker}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: quote
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: >-
          Entitlement probe, run against a covered reference name. The free plan gates by
          symbol as well as by endpoint - AVGO, ORCL, MU and QQQ answer HTTP 402 here
          while AAPL, MSFT and SPY answer 200 - so `ok` proves the entitlement, never
          that every name in the universe is covered.
      - id: historical_price_eod
        component: price_history
        method: GET
        url_template: https://financialmodelingprep.com/stable/historical-price-eod/full?symbol={ticker}&from={from_date}&to={to_date}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: historical_price_eod
        probe_enabled: true
        probe_symbol: AAPL
        probe_window_days: 400
        required_json_paths:
          - root
        note: >-
          Primary daily OHLCV source. Free and unmetered, unlike Alpha Vantage, whose
          adjusted series is premium and whose free series costs one of 25 daily requests.
      - id: economics
        component: S_M
        method: GET
        url_template: https://financialmodelingprep.com/stable/economic-calendar?from={from_date}&to={to_date}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: economics
        probe_enabled: true
        required: false
        probe_window_days: 30
        cache_target_template: macro
        required_json_paths:
          - root
        note: >-
          Dated macro calendar. Restricted on the current plan, so the macro leg falls back
          to `economic_indicators`, `treasury_rates`, and Alpha Vantage macro series.
      - id: economic_indicators
        component: S_M
        method: GET
        url_template: https://financialmodelingprep.com/stable/economic-indicators?name=GDP&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: economic_indicators
        probe_enabled: true
        cache_target_template: gdp
        required_json_paths:
          - root
        note: One cache slot per named series; the indicator name is the cache target.
      - id: treasury_rates
        component: S_M
        method: GET
        url_template: https://financialmodelingprep.com/stable/treasury-rates?apikey={api_key}
        cache_provider: fmp
        cache_endpoint: treasury_rates
        probe_enabled: true
        cache_target_template: curve
        required_json_paths:
          - root
        note: Full Treasury curve; the rates leg of the macro overview.
      - id: stock_news
        component: S_S
        method: GET
        url_template: https://financialmodelingprep.com/stable/news/stock?symbols={ticker}&limit=50&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: stock_news
        probe_enabled: true
        required: false
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: >-
          News fallback when Alpha Vantage is unavailable. Restricted on the current plan;
          Alpha Vantage NEWS_SENTIMENT carries the sentiment leg.
      - id: senate_latest
        component: S_S
        method: GET
        url_template: https://financialmodelingprep.com/stable/senate-latest?apikey={api_key}
        cache_provider: fmp
        cache_endpoint: senate_latest
        probe_enabled: true
        cache_target_template: all
        required_json_paths:
          - root
        note: >-
          Market-wide congressional disclosure feed. Do not pass symbol, limit, or page:
          the current free plan serves the unfiltered 100-row feed and gates the
          per-symbol/paginated variants. Filter locally against the run universe.
      - id: house_latest
        component: S_S
        method: GET
        url_template: https://financialmodelingprep.com/stable/house-latest?apikey={api_key}
        cache_provider: fmp
        cache_endpoint: house_latest
        probe_enabled: true
        cache_target_template: all
        required_json_paths:
          - root
        note: >-
          Market-wide congressional disclosure feed. Do not pass symbol, limit, or page:
          the current free plan serves the unfiltered 100-row feed and gates the
          per-symbol/paginated variants. Filter locally against the run universe.
      - id: insider_trades
        component: S_I
        method: GET
        url_template: https://financialmodelingprep.com/stable/insider-trading/search?symbol={ticker}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: insider_trades
        probe_enabled: true
        required: false
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: >-
          Per-symbol insider search is restricted on the current plan. Alpha Vantage
          INSIDER_TRANSACTIONS and SEC Form 4 carry S_I; never read the refusal as zero.
      - id: sec_filings
        component: filings
        method: GET
        url_template: https://financialmodelingprep.com/stable/sec-filings-search/symbol?symbol={ticker}&from={from_date}&to={to_date}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: sec_filings
        probe_enabled: true
        probe_symbol: AAPL
        probe_window_days: 90
        required_json_paths:
          - root
        note: Filing metadata fallback; prefer SEC EDGAR when possible.
      - id: institutional_ownership
        component: S_F
        method: GET
        url_template: https://financialmodelingprep.com/stable/institutional-ownership/symbol-positions-summary?symbol={ticker}&year={year}&quarter={quarter}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: institutional_ownership
        probe_enabled: true
        required: false
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: >-
          Restricted on the current plan; Alpha Vantage INSTITUTIONAL_HOLDINGS carries S_F.
          Mark S_F unavailable rather than zero when both refuse.
      - id: analyst_ratings
        component: S_S
        method: GET
        url_template: https://financialmodelingprep.com/stable/grades-consensus?symbol={ticker}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: analyst_ratings
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: >-
          Analyst buy/hold/sell counts, not a vendor scoring model. Aggregator-sourced, so
          the sentiment leg must be labelled as such. Probed on an operating company:
          consensus endpoints return [] for an index ETF.
      - id: price_target_consensus
        component: S_S
        method: GET
        url_template: https://financialmodelingprep.com/stable/price-target-consensus?symbol={ticker}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: price_target_consensus
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: >-
          Standing consensus target, paired with the grade consensus so S_S has both a
          direction and a magnitude. Aggregator-sourced.
      - id: analyst_estimates
        component: S_S
        method: GET
        url_template: https://financialmodelingprep.com/stable/analyst-estimates?symbol={ticker}&period=annual&limit=10&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: analyst_estimates
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: Consensus estimates; aggregator-sourced.
      - id: price_targets
        component: S_S
        method: GET
        url_template: https://financialmodelingprep.com/stable/price-target-summary?symbol={ticker}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: price_targets
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: Aggregator-sourced; never a standalone thesis.
      - id: income_statement
        component: fundamentals
        method: GET
        url_template: https://financialmodelingprep.com/stable/income-statement?symbol={ticker}&limit=5&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: income_statement
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: Fundamentals for class P theses; prefer company IR for headline figures.
      - id: balance_sheet_statement
        component: fundamentals
        method: GET
        url_template: https://financialmodelingprep.com/stable/balance-sheet-statement?symbol={ticker}&limit=5&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: balance_sheet_statement
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: Fundamentals for class P theses.
      - id: cash_flow_statement
        component: fundamentals
        method: GET
        url_template: https://financialmodelingprep.com/stable/cash-flow-statement?symbol={ticker}&limit=5&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: cash_flow_statement
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - root
        note: Fundamentals for class P theses.
      - id: earnings_calendar
        component: catalyst
        method: GET
        url_template: https://financialmodelingprep.com/stable/earnings-calendar?from={from_date}&to={to_date}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: earnings_calendar
        probe_enabled: true
        required: false
        probe_window_days: 30
        cache_target_template: calendar
        required_json_paths:
          - root
        note: >-
          Dated earnings calendar, the catalyst fallback behind Alpha Vantage. Absence from
          provider output is never proof of no event.
      - id: form_13f
        component: S_F
        method: GET
        url_template: https://financialmodelingprep.com/stable/institutional-ownership/extract?cik={cik}&year={year}&quarter={quarter}&apikey={api_key}
        cache_provider: fmp
        cache_endpoint: form_13f
        probe_enabled: true
        required: false
        probe_symbol: AAPL
        cache_target_template: "{cik}"
        required_json_paths:
          - root
        note: Quarterly 13F holdings extract; plan-gated on most tiers.

  - id: apewisdom
    display_name: ApeWisdom
