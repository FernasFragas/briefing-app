  - id: finra
    display_name: FINRA short sale volume
    priority: primary
    geography: [US]
    source_type: http_text
    components: [S_O]
    entitlement: free
    staleness_bound: daily
    endpoints:
      - id: short_sale_volume
        component: S_O
        method: GET
        url_template: https://cdn.finra.org/equity/regsho/daily/CNMSshvol{trade_date}.txt
        cache_provider: finra
        cache_endpoint: short_sale_volume
        cache_target_template: CNMS_{trade_date}
        probe_enabled: true
        response_format: text
        # The consolidated file lands on a T+1 schedule, so the most recent weekday is
        # routinely a 404 rather than an outage; walk back to the last published session.
        probe_date_lookback_days: 5
        note: Daily short-volume flow proxy only; not short interest.

  - id: sec_edgar
    display_name: SEC EDGAR filings
    priority: primary
    geography: [US]
    source_type: http_json
    components: [S_I, S_F]
    entitlement: free_user_agent_required
    staleness_bound: filing_release
    endpoints:
      - id: company_tickers
        component: reference
        method: GET
        url_template: https://www.sec.gov/files/company_tickers.json
        cache_provider: sec_edgar
        cache_endpoint: company_tickers
        cache_target_template: all
        probe_enabled: true
        required_json_paths:
          - root
        note: Ticker to CIK mapping; every other EDGAR probe resolves through it.
      - id: company_submissions
        component: S_I
        method: GET
        url_template: https://data.sec.gov/submissions/CIK{cik_padded}.json
        cache_provider: sec_edgar
        cache_endpoint: company_submissions
        cache_target_template: "{cik_padded}"
        probe_enabled: true
        probe_symbol: AAPL
        required_json_paths:
          - filings.recent.form
        note: CIK resolves from company_tickers, so the probe covers the whole lookup path.
      - id: filing_document
        component: filings
        method: GET
        url_template: https://www.sec.gov/Archives/edgar/data/{cik}/{accession}/{document}
        cache_provider: sec_edgar
        cache_endpoint: filing_document
        cache_target_template: "{cik}_{accession}"
        probe_enabled: true
        response_format: text
        probe_symbol: AAPL
        probe_filing_forms: ["4"]
        note: >-
          Fetches the newest Form 4 body located via company_submissions, which is the
          only way to prove the Archives path works rather than assume it.
      - id: form_13f
        component: S_F
        cache_provider: sec_edgar
        cache_endpoint: form_13f
        probe_enabled: false
        required: false
        note: >-
          Derived, not a URL of its own: 13F bodies are assembled from a filer's
          company_submissions plus filing_document, both of which are probed above.

  - id: manual_eurex_capture
    display_name: Eurex manual or browser chain capture
    priority: primary_when_captured
    geography: [EU]
    source_type: manual_csv
    components: [S_O]
    entitlement: manual_or_paid_feed
    staleness_bound: same_session
    endpoints:
      - id: options_chain_capture
        component: S_O
        cache_provider: eurex
        cache_endpoint: manual_options_capture
        probe_enabled: false
        manual_schema: schemas/eurex_options_manual_capture.csv
        note: Per-strike OI requires browser/manual/paid feed. Product-level stats are checksum only.

  - id: bundesanzeiger_fca
    display_name: EU disclosed net short positions
    priority: primary
    geography: [EU]
    source_type: browser_or_file
    components: [S_O]
    entitlement: free_public
    staleness_bound: daily_or_register_update
    endpoints:
      - id: bundesanzeiger_net_shorts
        component: S_O
        cache_provider: bundesanzeiger
        cache_endpoint: net_short_positions
        probe_enabled: false
        note: >-
          German disclosed net shorts above threshold; holder-level, not float-wide SI.
          The register answers a bare fetch with a session redirect, so the capture is a
          browser or manual download.
      - id: fca_short_positions
        component: S_O
        method: GET
        source_type: http_binary
        url_template: https://www.fca.org.uk/publication/data/short-positions-daily-update.xlsx
        cache_provider: fca
        cache_endpoint: short_positions_daily_update
        cache_target_template: daily_update
        probe_enabled: true
        response_format: binary
        note: >-
          UK aggregate net short positions. A plain XLSX download with no session or key,
          so it is fetched and validated as a spreadsheet rather than captured by hand.

  - id: eu_filings
    display_name: EU insider and ownership substitutes
    priority: primary
    geography: [EU]
    source_type: manual_or_ir
    components: [S_I, S_F]
    entitlement: issuer_or_national_register
    staleness_bound: filing_release
    endpoints:
      - id: mar_article_19
        component: S_I
        cache_provider: eu_oam
        cache_endpoint: mar_article_19
        probe_enabled: false
        note: >-
          PDMR/directors dealings substitute for Form 4. No pan-EU API exists; each
          national OAM publishes separately, so this stays an issuer or register capture.
      - id: major_holdings
        component: S_F
        cache_provider: eu_oam
        cache_endpoint: major_holdings
        probe_enabled: false
        note: >-
          Major-holdings notifications substitute for 13F; event-driven and per-register,
          so there is nothing to probe until a capture is dropped in.
